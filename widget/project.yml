name: LLUWidget
options:
  bundleIdPrefix: ru.romanovgleb
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: false
    SWIFT_VERSION: "5.10"

targets:
  LLUWidgetApp:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: LLUWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.romanovgleb.llu
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: LLU Widget

  LLUWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.romanovgleb.llu.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: LLU Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
